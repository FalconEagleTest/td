name: tdlib-build

on:
  push:
    branches: [ master ]
    paths:
      - 'td/**/*.cpp'
      - 'td/**/*.h' 
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'td/**/*.cpp'
      - 'td/**/*.h'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build for Android?"
        required: false
        default: "true"
        type: boolean
      build_macos:
        description: "Build for macOS Intel?"
        required: false
        default: "false"
        type: boolean
      build_ios:
        description: "Build for iOS?"
        required: false
        default: "false"
        type: boolean
      build_linux:
        description: "Build for Linux x64?"
        required: false
        default: "false"
        type: boolean
      build_windows:
        description: "Build for Windows x64?"
        required: false
        default: "true"
        type: boolean

jobs:
  build-android:
    if: github.event.inputs.build_android == 'true'
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: adopt
  
      - name: Setup dependencies
        run: |
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf cmake clang libc++-dev libc++abi-dev ninja-build
  
      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary
  
      - name: Fetch Android SDK
        run: |
          cd td/example/android
          ./fetch-sdk.sh
  
      - name: Build OpenSSL for Android
        run: |
          cd td/example/android
          ./build-openssl.sh
  
      - name: Build TDLib for Android
        run: |
          cd td/example/android
          ./build-tdlib.sh '' '' '' '' 'JSON'
  
      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: td/example/android/tdlib/tdlib.zip



  build-macos-intel:
    if: github.event.inputs.build_macos == 'true'
    runs-on: macos-11
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          brew install gperf cmake coreutils

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for macOS
        run: |
          cd td/example/ios
          ./build.sh

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-macos
          path: td/example/ios/tdjson/macOS/lib/libtdjson.zip

  build-ios:
    if: github.event.inputs.build_ios == 'true'
    runs-on: macos-11
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          brew install gperf cmake coreutils

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for iOS
        run: |
          cd td/example/ios
          ./build.sh

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-ios
          path: td/example/ios/tdjson/iOS/lib/libtdjson.zip

  build-linux-x64:
    if: github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          sudo apt-get install make git zlib1g-dev libssl-dev gperf php-cli cmake g++

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for Linux
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../tdlib ..
          cmake --build . --target install

      - name: Upload Linux Build
        uses: actions/upload-artifact@v3
        with:
          name: tdlib-linux
          path: td/tdlib/lib/libtdjson.zip

  build-windows-x64:
    if: github.event.inputs.build_windows == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Show TDLib source info
        run: |
          git show --summary
          echo "Building TDLib with streaming readFilePart implementation"

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: |
            vcpkg
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-stable-v1
          restore-keys: |
            ${{ runner.os }}-vcpkg-stable-
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows

      # CMake build cache - saves object files for incremental builds
      # Key strategy: Only invalidate when CMake config changes, not source files
      # CMake is smart enough to rebuild only changed source files
      - name: Cache CMake build  
        uses: actions/cache@v4
        id: cache-cmake
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-config-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'td/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-config-
            ${{ runner.os }}-cmake-

      - name: Add build info
        run: |
          echo "Building TDLib 1.8.55-streaming with readFilePart optimization" 
          echo "Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          
      - name: Build TDLib for Windows
        run: |
          if (!(Test-Path "build")) { New-Item -Path "build" -ItemType Directory }
          cd build
          
          # Configure CMake (only if not cached or configuration changed)
          if (!(Test-Path "CMakeCache.txt") -or "${{ steps.cache-cmake.outputs.cache-hit }}" -ne "true") {
            Write-Host "🔧 Configuring CMake..."
            cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake -DTD_VERSION_EXTRA="streaming-readFilePart" ..
          } else {
            Write-Host "⚡ Using cached CMake configuration"
          }
          
          Write-Host "🏗️ Building TDLib (incremental)..."
          cmake --build . --config Release
          
          Write-Host "📦 Installing TDLib..."
          cmake --build . --config Release --target install
          
          Write-Host "📁 Checking build output..."
          Get-ChildItem -Recurse ../tdlib
          
      - name: Create build info file
        run: |
          if (!(Test-Path "tdlib")) { New-Item -Path "tdlib" -ItemType Directory }
          if (!(Test-Path "tdlib/bin")) { New-Item -Path "tdlib/bin" -ItemType Directory }
          cd tdlib/bin
          "TDLib 1.8.55-streaming" | Out-File -FilePath "BUILD_INFO.txt" -Encoding UTF8
          "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Commit: ${{ github.sha }}" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Repository: ${{ github.repository }}" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Features: readFilePart streaming optimization" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Disk Space Savings: 99%+ for large video files" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          Get-Content "BUILD_INFO.txt"
          
      - name: zip
        run: |
          Write-Host "📋 Listing tdlib contents..."
          Get-ChildItem -Recurse tdlib
          
          Write-Host "🔍 Looking for DLL files..."
          $binPath = "tdlib/bin"
          if (Test-Path $binPath) {
            cd $binPath
            Get-ChildItem *.dll
            
            # Rename OpenSSL DLLs if they exist (flexible naming)
            if (Test-Path "*crypto*.dll") { 
              $cryptoDll = Get-ChildItem "*crypto*.dll" | Select-Object -First 1
              Move-Item $cryptoDll.Name "libcrypto-1_1.dll" -Force
            }
            if (Test-Path "*ssl*.dll") { 
              $sslDll = Get-ChildItem "*ssl*.dll" | Select-Object -First 1
              Move-Item $sslDll.Name "libssl-1_1.dll" -Force  
            }
            
            Write-Host "📦 Creating zip archive..."
            $filesToZip = @()
            if (Test-Path "libcrypto-1_1.dll") { $filesToZip += "libcrypto-1_1.dll" }
            if (Test-Path "libssl-1_1.dll") { $filesToZip += "libssl-1_1.dll" }
            if (Test-Path "tdjson.dll") { $filesToZip += "tdjson.dll" }
            if (Test-Path "zlib1.dll") { $filesToZip += "zlib1.dll" }
            if (Test-Path "BUILD_INFO.txt") { $filesToZip += "BUILD_INFO.txt" }
            
            Write-Host "Files to zip: $($filesToZip -join ', ')"
            if ($filesToZip.Count -gt 0) {
              7z a -tzip dlls.zip $filesToZip
              Write-Host "✅ Archive created successfully"
              7z l dlls.zip
            } else {
              Write-Host "❌ No DLL files found to zip"
              exit 1
            }
          } else {
            Write-Host "❌ tdlib/bin directory not found"
            exit 1
          }
          
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-streaming
          path: tdlib/bin/dlls.zip

  release:
    needs: [build-android, build-macos-intel, build-ios, build-linux-x64, build-windows-x64]
    if: always()
    runs-on: ubuntu-20.04
    steps:
      - name: Get current date/time
        id: datetime
        run: echo "DATE=$(date -u +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create a GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: tdlib-${{ env.DATE }}
          name: TDLib Build ${{ env.DATE }}
          body: "TDLib build release containing all selected platform binaries."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifacts/**/**"
