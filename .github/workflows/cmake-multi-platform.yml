name: tdlib-build

on:
  push:
    branches: [ master ]
    paths:
      - 'td/**/*.cpp'
      - 'td/**/*.h' 
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'td/**/*.cpp'
      - 'td/**/*.h'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_rebuild_cache:
        description: "Force rebuild vcpkg cache?"
        required: false
        default: "false"
        type: boolean
      build_android:
        description: "Build for Android?"
        required: false
        default: "true"
        type: boolean
      build_macos:
        description: "Build for macOS Intel?"
        required: false
        default: "false"
        type: boolean
      build_ios:
        description: "Build for iOS?"
        required: false
        default: "false"
        type: boolean
      build_linux:
        description: "Build for Linux x64?"
        required: false
        default: "false"
        type: boolean
      build_windows:
        description: "Build for Windows x64?"
        required: false
        default: "true"
        type: boolean

jobs:
  build-android:
    if: github.event.inputs.build_android == 'true'
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v2
        with:
          java-version: 17
          distribution: adopt
  
      - name: Setup dependencies
        run: |
          sudo apt-get install -y make git zlib1g-dev libssl-dev gperf cmake clang libc++-dev libc++abi-dev ninja-build
  
      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary
  
      - name: Fetch Android SDK
        run: |
          cd td/example/android
          ./fetch-sdk.sh
  
      - name: Build OpenSSL for Android
        run: |
          cd td/example/android
          ./build-openssl.sh
  
      - name: Build TDLib for Android
        run: |
          cd td/example/android
          ./build-tdlib.sh '' '' '' '' 'JSON'
  
      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: td/example/android/tdlib/tdlib.zip



  build-macos-intel:
    if: github.event.inputs.build_macos == 'true'
    runs-on: macos-11
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          brew install gperf cmake coreutils

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for macOS
        run: |
          cd td/example/ios
          ./build.sh

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-macos
          path: td/example/ios/tdjson/macOS/lib/libtdjson.zip

  build-ios:
    if: github.event.inputs.build_ios == 'true'
    runs-on: macos-11
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          brew install gperf cmake coreutils

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for iOS
        run: |
          cd td/example/ios
          ./build.sh

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-ios
          path: td/example/ios/tdjson/iOS/lib/libtdjson.zip

  build-linux-x64:
    if: github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - name: Setup dependencies
        run: |
          sudo apt-get install make git zlib1g-dev libssl-dev gperf php-cli cmake g++

      - name: Clone TDLib
        run: |
          git clone https://github.com/FalconEagleTest/td.git
          cd td
          git checkout master
          git show --summary

      - name: Build TDLib for Linux
        run: |
          cd td
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../tdlib ..
          cmake --build . --target install

      - name: Upload Linux Build
        uses: actions/upload-artifact@v3
        with:
          name: tdlib-linux
          path: td/tdlib/lib/libtdjson.zip

  build-windows-x64:
    if: github.event.inputs.build_windows == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Show TDLib source info
        run: |
          git show --summary
          echo "Building TDLib with streaming readFilePart implementation"

      - name: Check vcpkg availability
        id: check-vcpkg
        run: |
          if (Test-Path "C:\vcpkg") {
            echo "SYSTEM_VCPKG=true" >> $env:GITHUB_OUTPUT
            Write-Host "✅ System vcpkg detected at C:\vcpkg"
          } else {
            echo "SYSTEM_VCPKG=false" >> $env:GITHUB_OUTPUT
            Write-Host "📦 No system vcpkg - will use local vcpkg"
          }

      - name: Cache vcpkg (local only)
        uses: actions/cache@v4
        id: cache-vcpkg
        if: github.event.inputs.force_rebuild_cache != 'true' && steps.check-vcpkg.outputs.SYSTEM_VCPKG == 'false'
        with:
          path: |
            vcpkg
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-local-stable-v1
          restore-keys: |
            ${{ runner.os }}-vcpkg-local-stable-
            ${{ runner.os }}-vcpkg-local-

      - name: Setup vcpkg (Optimized)
        if: steps.check-vcpkg.outputs.SYSTEM_VCPKG == 'false' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          Write-Host "🚀 Setting up local vcpkg with pre-built packages..."
          Write-Host "📦 Cloning fresh vcpkg..."
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          ./bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
          ./vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows --triplet x64-windows

      - name: Setup system vcpkg
        if: steps.check-vcpkg.outputs.SYSTEM_VCPKG == 'true'
        run: |
          Write-Host "� Using system vcpkg..."
          Write-Host "✅ Using system vcpkg at C:\vcpkg"
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          C:\vcpkg\vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows --triplet x64-windows

      - name: Set vcpkg environment (cached local)
        if: steps.check-vcpkg.outputs.SYSTEM_VCPKG == 'false' && steps.cache-vcpkg.outputs.cache-hit == 'true'
        run: |
          Write-Host "📋 Using cached local vcpkg..."
          Write-Host "✅ Using cached local vcpkg"
          echo "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

      # CMake build cache - saves object files for incremental builds
      # Key strategy: Only invalidate when CMake config changes, not source files
      # CMake is smart enough to rebuild only changed source files
      - name: Cache CMake build  
        uses: actions/cache@v4
        id: cache-cmake
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-config-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'td/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-config-
            ${{ runner.os }}-cmake-

      - name: Ensure build directory exists for cache
        run: |
          if (!(Test-Path "build")) { 
            Write-Host "📁 Creating build directory for cache compatibility"
            New-Item -Path "build" -ItemType Directory 
          } else {
            Write-Host "📁 Build directory already exists"
          }

      - name: Add build info
        run: |
          echo "Building TDLib 1.8.55-streaming with readFilePart optimization" 
          echo "Build date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          
      - name: Build TDLib for Windows (incremental)
        id: build
        continue-on-error: true
        run: |
          $buildSuccess = $true
          try {
            if (!(Test-Path "build")) { New-Item -Path "build" -ItemType Directory }
            cd build
            if (!(Test-Path "CMakeCache.txt")) {
              Write-Host "🔧 Configuring CMake..."
              # Determine the correct vcpkg toolchain file path
              $vcpkgToolchain = if ($env:VCPKG_ROOT) { "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" } else { "..\vcpkg\scripts\buildsystems\vcpkg.cmake" }
              Write-Host "Using vcpkg toolchain: $vcpkgToolchain"
              cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$vcpkgToolchain" -DTD_VERSION_EXTRA="streaming-readFilePart" ..
              if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
            } else {
              Write-Host "⚡ Using cached CMake configuration"
            }
            Write-Host "🏗️ Building TDLib (incremental)..."
            cmake --build . --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Build failed" }
            Write-Host "📦 Installing TDLib..."
            cmake --build . --config Release --target install
            if ($LASTEXITCODE -ne 0) { throw "Install failed" }
            Write-Host "📁 Checking build output..."
            Get-ChildItem -Recurse ../tdlib
            echo "BUILD_STATUS=success" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "❌ Build failed: $_" -ForegroundColor Red
            $buildSuccess = $false
            echo "BUILD_STATUS=failed" >> $env:GITHUB_OUTPUT
            echo "BUILD_ERROR=$_" >> $env:GITHUB_OUTPUT
          }
          
      - name: Create build info file
        if: always()
        run: |
          if (!(Test-Path "tdlib")) { New-Item -Path "tdlib" -ItemType Directory }
          if (!(Test-Path "tdlib/bin")) { New-Item -Path "tdlib/bin" -ItemType Directory }
          cd tdlib/bin
          
          $buildStatus = if ("${{ steps.build.outputs.BUILD_STATUS }}" -eq "success") { "SUCCESS" } else { "FAILED" }
          $buildError = "${{ steps.build.outputs.BUILD_ERROR }}"
          
          "TDLib 1.8.55-streaming" | Out-File -FilePath "BUILD_INFO.txt" -Encoding UTF8
          "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Build Status: $buildStatus" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Commit: ${{ github.sha }}" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Repository: ${{ github.repository }}" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Features: readFilePart streaming optimization" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          "Disk Space Savings: 99%+ for large video files" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          if ($buildError) {
            "Build Error: $buildError" | Out-File -FilePath "BUILD_INFO.txt" -Append -Encoding UTF8
          }
          Get-Content "BUILD_INFO.txt"
          
      - name: zip
        if: always()
        run: |
          Write-Host "📋 Listing tdlib contents..."
          if (Test-Path "tdlib") {
            Get-ChildItem -Recurse tdlib
          } else {
            Write-Host "⚠️ tdlib directory not found - build may have failed"
          }
          
          Write-Host "🔍 Looking for DLL files..."
          $binPath = "tdlib/bin"
          if (Test-Path $binPath) {
            cd $binPath
            
            # Always include BUILD_INFO.txt
            $filesToZip = @()
            if (Test-Path "BUILD_INFO.txt") { $filesToZip += "BUILD_INFO.txt" }
            
            # Look for DLL files (may not exist if build failed)
            $dllFiles = Get-ChildItem *.dll -ErrorAction SilentlyContinue
            if ($dllFiles) {
              Write-Host "✅ Found DLL files"
              
              # Rename OpenSSL DLLs if they exist (flexible naming)
              if (Test-Path "*crypto*.dll") { 
                $cryptoDll = Get-ChildItem "*crypto*.dll" | Select-Object -First 1
                Move-Item $cryptoDll.Name "libcrypto-1_1.dll" -Force
              }
              if (Test-Path "*ssl*.dll") { 
                $sslDll = Get-ChildItem "*ssl*.dll" | Select-Object -First 1
                Move-Item $sslDll.Name "libssl-1_1.dll" -Force  
              }
              
              # Add DLL files to zip list
              if (Test-Path "libcrypto-1_1.dll") { $filesToZip += "libcrypto-1_1.dll" }
              if (Test-Path "libssl-1_1.dll") { $filesToZip += "libssl-1_1.dll" }
              if (Test-Path "tdjson.dll") { $filesToZip += "tdjson.dll" }
              if (Test-Path "zlib1.dll") { $filesToZip += "zlib1.dll" }
            } else {
              Write-Host "⚠️ No DLL files found - this may indicate a build failure"
            }
            
            Write-Host "📦 Creating archive..."
            Write-Host "Files to zip: $($filesToZip -join ', ')"
            if ($filesToZip.Count -gt 0) {
              7z a -tzip dlls.zip $filesToZip
              Write-Host "✅ Archive created successfully"
              7z l dlls.zip
            } else {
              Write-Host "⚠️ Creating minimal archive with build info only"
              "Build failed - no artifacts produced" | Out-File -FilePath "ERROR.txt" -Encoding UTF8
              7z a -tzip dlls.zip ERROR.txt
            }
          } else {
            Write-Host "❌ tdlib/bin directory not found - creating error archive"
            if (!(Test-Path "tdlib")) { New-Item -Path "tdlib" -ItemType Directory }
            if (!(Test-Path "tdlib/bin")) { New-Item -Path "tdlib/bin" -ItemType Directory }
            cd tdlib/bin
            "Build completely failed - no output directory created" | Out-File -FilePath "CRITICAL_ERROR.txt" -Encoding UTF8
            7z a -tzip dlls.zip CRITICAL_ERROR.txt
          }
          
      - name: Upload Windows Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-streaming-${{ steps.build.outputs.BUILD_STATUS || 'unknown' }}
          path: tdlib/bin/dlls.zip

      - name: Collect build logs on failure
        if: always() && steps.build.outputs.BUILD_STATUS == 'failed'
        run: |
          Write-Host "🔍 Collecting build logs for debugging..."
          $logDir = "build-logs"
          if (!(Test-Path $logDir)) { New-Item -Path $logDir -ItemType Directory }
          
          # Collect CMake logs
          if (Test-Path "build/CMakeFiles/CMakeOutput.log") {
            Copy-Item "build/CMakeFiles/CMakeOutput.log" "$logDir/CMakeOutput.log"
          }
          if (Test-Path "build/CMakeFiles/CMakeError.log") {
            Copy-Item "build/CMakeFiles/CMakeError.log" "$logDir/CMakeError.log"
          }
          if (Test-Path "build/CMakeCache.txt") {
            Copy-Item "build/CMakeCache.txt" "$logDir/CMakeCache.txt"
          }
          
          # Create a summary of the failure
          "Build Failure Summary" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Encoding UTF8
          "========================" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Append -Encoding UTF8
          "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Append -Encoding UTF8
          "Commit: ${{ github.sha }}" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Append -Encoding UTF8
          "Error: ${{ steps.build.outputs.BUILD_ERROR }}" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Append -Encoding UTF8
          "========================" | Out-File -FilePath "$logDir/FAILURE_SUMMARY.txt" -Append -Encoding UTF8
          
          Write-Host "📋 Available log files:"
          Get-ChildItem $logDir
          
      - name: Upload build logs on failure
        if: always() && steps.build.outputs.BUILD_STATUS == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-build-logs-failed
          path: build-logs/

      - name: Post-build cleanup and cache preparation
        if: always()
        run: |
          Write-Host "🧹 Preparing cache directories for optimal storage..."
          
          # Ensure build directory exists for cache (even if build failed)
          if (!(Test-Path "build")) { 
            Write-Host "📁 Creating minimal build directory for cache"
            New-Item -Path "build" -ItemType Directory 
            # Create a marker file to indicate build state
            if ("${{ steps.build.outputs.BUILD_STATUS }}" -eq "failed") {
              "BUILD_FAILED" | Out-File -FilePath "build/.build_failed" -Encoding UTF8
            }
          }
          
          # Clean up temporary files that shouldn't be cached
          if (Test-Path "build") {
            Write-Host "🗑️ Cleaning temporary build files..."
            Get-ChildItem "build" -Recurse -Include "*.tmp", "*.temp", "*.log" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          
          # Verify cache directories exist
          $cacheStatus = @()
          if (Test-Path "build") { 
            $cacheStatus += "build: ✅" 
          } else { 
            $cacheStatus += "build: ❌" 
          }
          
          if (Test-Path "vcpkg" -ErrorAction SilentlyContinue) { 
            $cacheStatus += "vcpkg: ✅" 
          } else { 
            $cacheStatus += "vcpkg: ⚠️ (using system)" 
          }
          
          Write-Host "📋 Cache directories status:"
          $cacheStatus | ForEach-Object { Write-Host "  $_" }

  release:
    needs: [build-android, build-macos-intel, build-ios, build-linux-x64, build-windows-x64]
    if: always() && (needs.build-android.result == 'success' || needs.build-macos-intel.result == 'success' || needs.build-ios.result == 'success' || needs.build-linux-x64.result == 'success' || needs.build-windows-x64.result == 'success')
    runs-on: ubuntu-20.04
    steps:
      - name: Get current date/time
        id: datetime
        run: echo "DATE=$(date -u +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Create a GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: tdlib-${{ steps.datetime.outputs.DATE }}
          name: TDLib Build ${{ steps.datetime.outputs.DATE }}
          body: "TDLib build release containing all selected platform binaries."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifacts/**/**"
